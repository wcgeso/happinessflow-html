<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="google-site-verification" content="UXo5A9a5SPYNQ1E5LIU0p7pONjBFr2Ud7JSvfpZuhPU" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="幸福流" />
  <meta name="theme-color" content="#0f172a" /> <!-- Match your deep slate background -->
  <link rel="icon" type="image/png" href="/icon-192.png?v=7" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png?v=7" />
  <link rel="apple-touch-icon" href="/icon-192.png?v=7" />
  <link rel="manifest" href="/manifest.json?v=7" />
  <title>幸福流 HappinessFlow</title>
  <!-- 在 React 載入前同步設定 --app-height，修正 iOS standalone 底部缺口 -->
  <script>
    (function() {
      function setAppHeight() {
        document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
      }
      setAppHeight();
      window.addEventListener('resize', setAppHeight);
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --app-height: 100%;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: 0px;
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    /* Safe Area Utility Classes */
    .pt-safe { padding-top: env(safe-area-inset-top, 0px) !important; }
    .pb-safe { padding-bottom: 0px !important; }
    .pl-safe { padding-left: env(safe-area-inset-left, 0px) !important; }
    .pr-safe { padding-right: env(safe-area-inset-right, 0px) !important; }
    .mt-safe { margin-top: env(safe-area-inset-top, 0px) !important; }
    .mb-safe { margin-bottom: 0px !important; }
    .top-safe { top: env(safe-area-inset-top, 0px) !important; }
    .bottom-safe { bottom: 0px !important; }

    html,
    body {
      height: 100vh;
      min-height: 100vh;
      background-color: #020617;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      -moz-text-size-adjust: 100%;
      text-size-adjust: 100%;
      touch-action: manipulation;
      overflow: hidden;
    }

    #root {
      height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    body {
      font-family: 'Inter', sans-serif;
    }

    /* Custom scrollbar for webkit */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #1e293b;
    }

    ::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Prevent zoom on input focus for iOS */
    input,
    select,
    textarea {
      font-size: 16px !important;
    }
  </style>
</head>

<body class="bg-slate-950 text-white">
  <div id="root"></div>
  <script>
    window.addEventListener('error', function(event) {
      document.body.innerHTML = '<div style="color:red;padding:20px;background:white"><h1>Global Error</h1><pre>' + event.error?.stack + '</pre></div>';
    });
    window.addEventListener('unhandledrejection', function(event) {
      document.body.innerHTML = '<div style="color:red;padding:20px;background:white"><h1>Unhandled Promise Rejection</h1><pre>' + event.reason?.stack + '</pre></div>';
    });
  </script>
  <script type="module" src="/index.tsx"></script>
  <!-- Google Verification: Privacy Policy and Terms Links -->
  <div style="display:none;">
    <a href="/privacy.html">Privacy Policy</a>
    <a href="/terms.html">Terms of Service</a>
  </div>
</body>

</html>
